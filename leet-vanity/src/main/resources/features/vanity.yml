      - OXIDIZED_COPPER_DOOR
      - WAXED_COPPER_DOOR
      - WAXED_EXPOSED_COPPER_DOOR
      - WAXED_WEATHERED_COPPER_DOOR
      - WAXED_OXIDIZED_COPPER_DOOR

  # Sitting: right-click a block in the list to sit on it. The default list is
  # every stair and slab material; add or remove freely. Armor-stand seating is
  # used, so the player sits in place (no boat/entity) and sneaks to get back up.
  sit:
    enabled: true
    # Per-block seat height above the floor (in blocks). 0 = default.
    # Most stairs/slabs use the default; tweak per-material if a seat looks off.
    seat-height: 0
    seat-blocks:
      - OAK_STAIRS
      - SPRUCE_STAIRS
      - BIRCH_STAIRS
      - JUNGLE_STAIRS
      - ACACIA_STAIRS
      - CHERRY_STAIRS
