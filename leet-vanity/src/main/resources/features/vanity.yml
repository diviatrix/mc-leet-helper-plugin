  default-permission: false
  worlds: []
  cooldown: 0
  message-type: ACTION_BAR

feature:
  # Opening either half of a double door opens/closes its matching neighbour too.
  connected:
    enabled: true
    openable-types:
      - OAK_DOOR
      - SPRUCE_DOOR
      - BIRCH_DOOR
      - JUNGLE_DOOR
      - ACACIA_DOOR
      - DARK_OAK_DOOR
