name: LeetHelper
version: "1.0.0"
main: com.leet.helper.HelperPlugin
api-version: "26.2"
description: Leet Helper Plugin
author: Leet
softdepend: [Vault]

commands:
  helper:
    description: Admin helper command
    usage: /helper <list|toggle|info> [args]
    permission: helper.admin
  back:
    description: Teleport back to death location
    usage: /back
    permission: leet.feat.back
  leet:
    description: Toggle features on/off for yourself
    usage: /leet <list|dj|crop|tree|fall>
    aliases: []

permissions:
  helper.admin:
    description: Admin access to helper commands
    default: op
    children:
      helper.admin.list: true
      helper.admin.toggle: true
      helper.admin.info: true
  helper.admin.list:
    description: List all features
    default: op
  helper.admin.toggle:
    description: Toggle features on/off
    default: op
  helper.admin.info:
    description: View feature info
    default: op
