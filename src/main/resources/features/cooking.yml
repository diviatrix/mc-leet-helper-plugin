base:
  enabled: true       # server-level switch: ON = recipes available to every player
  # Cooking needs NO permission and no per-player toggle: recipes and custom dish
  # nutrition apply to everyone whenever the feature is enabled (plus the world
  # whitelist below). The `permission`/`default-permission` keys are intentionally
  # omitted — there is no node to grant.
  worlds: []
  cooldown: 0
  message-type: ACTION_BAR

feature:
  # Custom items the cooking recipes produce (and, for Dough, require as an
  # ingredient). Each item = a base Material the item is shown as + name/lore.
  # Dish items carry hunger/saturation: on eat the plugin cancels the vanilla
  # nutrition and applies THESE values instead (dishes restore more than their
  # raw parts). Items without hunger/saturation are plain ingredients (Dough).
  items:
    dough:
      material: WHEAT
      name: "Dough"
      lore:
        - "Flour and egg, mixed and ready."
    croissant:
      material: BREAD
      name: "Croissant"
      hunger: 6
      saturation: 8
      lore:
        - "Flaky, buttery bakery fresh."
    borsh:
      material: BREAD
      name: "Borsh"
      hunger: 8
      saturation: 12
      lore:
        - "Hearty beetroot and beef stew."
    pelmeni:
      material: BREAD
      name: "Pelmeni"
      hunger: 7
      saturation: 9
      lore:
        - "Dumplings stuffed with seasoned beef."
    instant-noodle:
      material: BREAD
      name: "Instant Noodle"
      hunger: 5
      saturation: 7
      lore:
        - "Quick noodles, ready in a bowl."
    ramen:
      material: BREAD
      name: "Ramen"
      hunger: 8
      saturation: 12
      lore:
        - "Rich broth, noodles and egg."
    banh-mi:
      material: BREAD
      name: "Banh Mi"
      hunger: 7
      saturation: 10
      lore:
        - "A crusty baguette stuffed with chicken."
    milk-porridge:
      material: BREAD
      name: "Milk Porridge"
      hunger: 6
      saturation: 10
      lore:
        - "Soft, sweet grain in warm milk."
    creamy-mushroom-soup:
      material: BREAD
      name: "Creamy Mushroom Soup"
      hunger: 7
      saturation: 10
      lore:
        - "Silky mushrooms in cream."
    chicken-skewers:
      material: COOKED_CHICKEN
      name: "Chicken Skewers"
      hunger: 8
      saturation: 11
      lore:
        - "Grilled chicken on a stick."
    charlotte:
      material: BREAD
      name: "Charlotte"
      hunger: 6
      saturation: 8
      lore:
        - "A layered apple-and-sponge cake."

  # Crafting recipes. Type SHAPELESS = a flat `ingredients` list; SHAPED = a 3x3
  # `shape` of letters plus an `ingredients` map of letter -> item. A result is
  # either a custom item id above (e.g. `dough`) or `material:<MATERIAL>` for a
  # vanilla output (e.g. the second way to make bread). Shapeless ingredients are
  # either a vanilla Material name or a custom item id (matched exactly by tag+name).
  recipes:
    dough:
      type: SHAPELESS
      ingredients:
        - WHEAT
        - WHEAT
        - EGG
      result: dough
      amount: 1
    bread:
      type: SHAPELESS
      ingredients:
        - dough
      result: material:BREAD
      amount: 1
    croissant:
      type: SHAPED
      shape:
        - "DDD"
        - "SMS"
        - "..."
      ingredients:
        D: dough
        S: SUGAR
        M: MILK_BUCKET
      result: croissant
      amount: 3
    borsh:
      type: SHAPED
      shape:
        - "BRB"
        - "PPP"
        - "CWA"
      ingredients:
        B: BEEF
        R: BEETROOT
        P: POTATO
        C: CARROT
        W: BOWL
        A: ALLIUM
      result: borsh
      amount: 3
    pelmeni:
      type: SHAPED
      shape:
        - "DDD"
        - "BPB"
        - "AWA"
      ingredients:
        D: dough
        B: BEEF
        P: PORKCHOP
        A: ALLIUM
        W: BOWL
      result: pelmeni
      amount: 3
    instant-noodle:
      type: SHAPED
      shape:
        - "DED"
        - ".W."
        - "..."
      ingredients:
        D: dough
        E: EGG
        W: BOWL
      result: instant-noodle
      amount: 2
    ramen:
      type: SHAPED
      shape:
        - "IEI"
        - "PKC"
        - ".W."
      ingredients:
        I: instant-noodle
        E: EGG
        P: PORKCHOP
        K: DRIED_KELP
        C: CHICKEN
        W: BOWL
      result: ramen
      amount: 2
    banh-mi:
      type: SHAPED
      shape:
        - "BCA"
        - "..."
        - "..."
      ingredients:
        B: BREAD
        C: COOKED_CHICKEN
        A: ALLIUM
      result: banh-mi
      amount: 1
    milk-porridge:
      type: SHAPED
      shape:
        - "MWS"
        - ".B."
        - "..."
      ingredients:
        M: MILK_BUCKET
        W: WHEAT
        S: SUGAR
        B: BOWL
      result: milk-porridge
      amount: 1
    creamy-mushroom-soup:
      type: SHAPED
      shape:
        - "BRK"
        - ".W."
        - "..."
      ingredients:
        B: BROWN_MUSHROOM
        R: RED_MUSHROOM
        K: MILK_BUCKET
        W: BOWL
      result: creamy-mushroom-soup
      amount: 1
    chicken-skewers:
      type: SHAPED
      shape:
        - "CCS"
        - "..."
        - "..."
      ingredients:
        C: COOKED_CHICKEN
        S: STICK
      result: chicken-skewers
      amount: 1
    charlotte:
      type: SHAPED
      shape:
        - "DAD"
        - "SES"
        - "..."
      ingredients:
        D: dough
        A: APPLE
        S: SUGAR
        E: EGG
      result: charlotte
      amount: 1

messages:
  feature-off: "<red>Cooking is currently off for you."