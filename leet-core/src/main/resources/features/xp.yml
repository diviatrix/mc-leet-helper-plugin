base:
  enabled: true
  permission: leet.feat.xp
  default-permission: false
  worlds: []
  cooldown: 0
  message-type: ACTION_BAR

feature:
  # Per-material XP amounts. Only listed materials award; edit freely.
  # Balance: building is effortless (1 XP/block baseline); the more-effortful
  # jobs (mining, woodcutting, fishing, killing) pay more per action.
  mining:
    # XP for mined blocks. Only ores (and ancient debris) award — mining plain
    # stone/stone-variants and raw-ore blocks gives nothing.
    materials:
      COAL_ORE: 1
      DEEPSLATE_COAL_ORE: 1
      COPPER_ORE: 2
      DEEPSLATE_COPPER_ORE: 2
      IRON_ORE: 5
      DEEPSLATE_IRON_ORE: 5
      GOLD_ORE: 10
      DEEPSLATE_GOLD_ORE: 10
      NETHER_GOLD_ORE: 10
      REDSTONE_ORE: 2
      DEEPSLATE_REDSTONE_ORE: 2
      LAPIS_ORE: 5
      DEEPSLATE_LAPIS_ORE: 5
      DIAMOND_ORE: 25
      DEEPSLATE_DIAMOND_ORE: 25
      EMERALD_ORE: 25
      DEEPSLATE_EMERALD_ORE: 25
      ANCIENT_DEBRIS: 20
  woodcutting:
    materials:
      OAK_LOG: 1
      SPRUCE_LOG: 1
      BIRCH_LOG: 1
      JUNGLE_LOG: 1
      ACACIA_LOG: 1
      DARK_OAK_LOG: 1
      MANGROVE_LOG: 1
      CHERRY_LOG: 1
      PALE_OAK_LOG: 1
      CRIMSON_STEM: 1
      WARPED_STEM: 1
  crops:
    materials:
      WHEAT: 2
      CARROTS: 2
      POTATOES: 2
      BEETROOTS: 2
      NETHER_WART: 2
      COCOA: 2
      SWEET_BERRY_BUSH: 1
  fishing:
    amount: 5
  building:
    amount: 0
  killing:
    amount: 8
    mobs:
      ZOMBIE: 5
      SKELETON: 7
      SPIDER: 7
      CREEPER: 12
      ENDERMAN: 15
      PIGLIN: 10
      ZOMBIFIED_PIGLIN: 10
  # How to remember blocks the player placed so a later break gives no XP.
  # memory    - in-memory only, lost on restart (fastest, no DB growth)
  # persistent- stored in SQLite, survives restarts (bounded to ~1 hour)
  placed-tracking: memory

messages:
  xp-gained: "<green>+<amount> XP<reset> (<action>)"